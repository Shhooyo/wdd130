<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Rapid Torrent</title>
    <meta name="description"
        content="Contact Rapid Torrent for rafting reservations, general questions, and website suggestions. Find our address, phone number, email, and employee information.">
    <meta name="author" content="Evellyn Bruneto Blanco">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/rapids.jpg" alt="Rapid Torrent site logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="contact-heading">
            <h1>Rapid Torrent</h1>

            <div class="company-info">
                <p><strong>123 River Road</strong></p>
                <p>Montana, United States</p>
                <p><strong>+1 587 098 3333</strong></p>
                <p>info@rapidtorrent.com</p>
            </div>
        </section>

        <section class="contact-section">

            <div class="map">
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2819.2830992506088!2d-110.7249335!3d45.039476699999994!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x534fd0db11fb2ded%3A0x9089e217dce90bd5!2sWild%20West%20Rafting%3A%20Yellowstone%20Whitewater%20Rafting!5e0!3m2!1spt-BR!2sbr!4v1785623687421!5m2!1spt-BR!2sbr"
            width="600"
            height="450"
            allowfullscreen
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
            title="Map showing the location of Wild West Rafting">
        </iframe>
            </div>

            <form>

                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your email" required>
                </div>

                <fieldset>
                    <legend>Purpose</legend>

                    <label>
                        <input type="radio" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="message-box">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here" required></textarea>
                </div>

                <label class="subscribe">
                    <input type="checkbox" name="subscribe">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>

            </form>

        </section>

        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/angel.jpg" alt="Employee profile">
                <figcaption>Operations Manager</figcaption>
            </figure>

            <figure>
                <img src="images/luciana.jpg" alt="Employee profile">
                <figcaption>Rafting Guide</figcaption>
            </figure>

            <figure>
                <img src="images/arthur.jpg" alt="Employee profile">
                <figcaption>Customer Service Manager</figcaption>
            </figure>

        </section>

    </main>

    <footer>
        <p>©2026 🚣 Rapid Torrent 🚣 Evellyn Blanco</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
